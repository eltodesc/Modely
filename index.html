      // =========================================================================
      // 1. MUSIC THEORY & TRANSPOSITION ENGINE

      const KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

const KEY_INFO = {
  C:  { pitch: 0,  letter: 0, preferFlats: false },
  Db: { pitch: 1,  letter: 1, preferFlats: true },
  D:  { pitch: 2,  letter: 1, preferFlats: false },
  Eb: { pitch: 3,  letter: 2, preferFlats: true },
  E:  { pitch: 4,  letter: 2, preferFlats: false },

  'F#': { pitch: 6, letter: 3, preferFlats: false },

  Ab: { pitch: 8,  letter: 5, preferFlats: true },
  A:  { pitch: 9,  letter: 5, preferFlats: false },
  Bb: { pitch: 10, letter: 6, preferFlats: true },
  B:  { pitch: 11, letter: 6, preferFlats: false },
};

const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const NATURAL_PITCHES = [0, 2, 4, 5, 7, 9, 11];
const MAJOR_SCALE_SEMITONES = [0, 2, 4, 5, 7, 9, 11];

const SHARP_CHROMATIC = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_CHROMATIC = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

const NOTE_TO_PITCH = {
  C: 0, 'B#': 0, Dbb: 0,
  'C#': 1, Db: 1, 'B##': 1,
  D: 2, 'C##': 2, Ebb: 2,
  'D#': 3, Eb: 3, Fbb: 3,
  E: 4, Fb: 4, 'D##': 4,
  F: 5, 'E#': 5, Gbb: 5,
  'F#': 6, Gb: 6, 'E##': 6,
  G: 7, 'F##': 7, Abb: 7,
  'G#': 8, Ab: 8,
  A: 9, 'G##': 9, Bbb: 9,
  'A#': 10, Bb: 10, Cbb: 10,
  B: 11, Cb: 11, 'A##': 11,
};

const ROMAN_DEGREE_MAP = {
  i: 1,
  ii: 2,
  iii: 3,
  iv: 4,
  v: 5,
  vi: 6,
  vii: 7,
};

/**
 * Parse a Roman numeral chord token like "bIIImaj7", "#iv°7", "V7#9", "iiø7", "I7sus4".
 */
function parseRomanNumeral(roman) {
  const match = roman.match(/^(bb|b|##|#|♮)?(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(.*)$/);
  if (!match) {
    return null;
  }

  const [, accidentalStr = '', numeral, rawSuffix = ''] = match;
  let accidentalOffset = 0;
  if (accidentalStr === 'b') accidentalOffset = -1;
  else if (accidentalStr === 'bb') accidentalOffset = -2;
  else if (accidentalStr === '#') accidentalOffset = 1;
  else if (accidentalStr === '##') accidentalOffset = 2;

  const isLower = numeral === numeral.toLowerCase();
  const degree = ROMAN_DEGREE_MAP[numeral.toLowerCase()];

  // Determine canonical chord quality suffix
  let quality = rawSuffix;
  if (isLower) {
    if (rawSuffix === '') {
      quality = 'm';
    } else if (rawSuffix === '°' || rawSuffix === 'dim') {
      quality = 'dim';
    } else if (rawSuffix === '°7' || rawSuffix === 'dim7') {
      quality = 'dim7';
    } else if (rawSuffix === 'ø' || rawSuffix === 'ø7' || rawSuffix === 'm7b5') {
      quality = 'm7b5';
    } else if (rawSuffix.startsWith('sus')) {
      quality = rawSuffix;
    } else if (rawSuffix === 'b5') {
      quality = 'mb5';
    } else if (rawSuffix.startsWith('m')) {
      quality = rawSuffix;
    } else {
      quality = 'm' + rawSuffix;
    }
  } else {
    if (rawSuffix === '+') {
      quality = 'aug';
    } else if (rawSuffix === '°') {
      quality = 'dim';
    } else if (rawSuffix === '°7') {
      quality = 'dim7';
    } else if (rawSuffix === 'ø7') {
      quality = 'm7b5';
    }
  }

  return {
    degree,
    accidentalOffset,
    isLower,
    quality,
    roman,
  };
}

/**
 * Compute enharmonically spelled root note for a given key, scale degree (1..7), and accidental offset.
 */
function transposeDegreeToNote(key, degree, accidentalOffset) {
  const info = KEY_INFO[key] || KEY_INFO.C;
  const targetPitch =
    (info.pitch + MAJOR_SCALE_SEMITONES[degree - 1] + accidentalOffset + 24) % 12;
  const targetLetterIdx = (info.letter + degree - 1) % 7;
  const naturalPitch = NATURAL_PITCHES[targetLetterIdx];
  const diff = ((targetPitch - naturalPitch + 18) % 12) - 6;

  // Keep single sharps/flats and naturals for proper diatonic/modal spelling;
  // simplify double-sharps/double-flats to readable enharmonics matching key polarity.
  if (diff === 0) return LETTERS[targetLetterIdx];
  if (diff === 1) return `${LETTERS[targetLetterIdx]}#`;
  if (diff === -1) return `${LETTERS[targetLetterIdx]}b`;

  const useFlats = key === 'C' ? accidentalOffset < 0 : info.preferFlats;
  return useFlats ? FLAT_CHROMATIC[targetPitch] : SHARP_CHROMATIC[targetPitch];
}

/**
 * Transpose a Roman numeral chord symbol into an actual chord object in the selected key.
 */
function transposeRomanChord(roman, key) {
  const parsed = parseRomanNumeral(roman);
  if (!parsed) {
    return {
      roman,
      root: key,
      quality: '',
      name: `${key}`,
      pitch: NOTE_TO_PITCH[key] ?? 0,
    };
  }

  const root = transposeDegreeToNote(key, parsed.degree, parsed.accidentalOffset);
  const name = `${root}${parsed.quality}`;
  const pitch = NOTE_TO_PITCH[root] ?? 0;

  return {
    roman,
    root,
    quality: parsed.quality,
    name,
    pitch,
  };
}

/**
 * Format a mode name with the active key prefix, e.g. "C Dorian".
 */
function formatModeTitle(key, modeName) {
  return `${key} ${modeName}`;
}

const FRETBOARD_SIMPLIFY = {
  Fb: 'E',
  Cb: 'B',
  'E#': 'F',
  'B#': 'C',
};

/**
 * Compute all scale tones (pitch classes, enharmonic note names, intervals, and root flag)
 * for a given key and mode interval formula string (e.g. "1 - 2 - b3 - 4 - 5 - 6 - b7").
 */
function getModeScaleNotes(key, formula) {
  const info = KEY_INFO[key] || KEY_INFO.C;
  const tokens = formula.split(' - ').map((t) => t.trim()).filter(Boolean);
  const pitchMap = {};
  const ordered = [];

  for (const token of tokens) {
    const m = token.match(/^(bb|b|##|#)?([1-7])$/);
    if (!m) continue;
    const [, accStr = '', degStr] = m;
    const degree = Number(degStr);
    let offset = 0;
    if (accStr === 'b') offset = -1;
    else if (accStr === 'bb') offset = -2;
    else if (accStr === '#') offset = 1;
    else if (accStr === '##') offset = 2;

    const pitchClass = (info.pitch + MAJOR_SCALE_SEMITONES[degree - 1] + offset + 24) % 12;
    let note = transposeDegreeToNote(key, degree, offset);
    if (offset !== 0 && FRETBOARD_SIMPLIFY[note]) {
      note = FRETBOARD_SIMPLIFY[note];
    }
    const isRoot = degree === 1 && offset === 0;
    const entry = {
      pitchClass,
      note,
      interval: isRoot ? 'R' : token,
      isRoot,
    };
    if (!pitchMap[pitchClass]) {
      pitchMap[pitchClass] = entry;
      ordered.push(entry);
    }
  }

  return { ordered, pitchMap };
}

const QUALITY_ALIASES = {
  '°': 'dim',
  '°7': 'dim7',
  'ø7': 'm7b5',
  '+': 'aug',
  'm(add9)': 'madd9',
  '7b13': '7alt',
  '7#5': '7alt',
  '9#11': '7#11',
  '13#11': '7#11',
  'm11': 'm7',
  'maj9': 'maj7',
  '6/9': '6',
};

function normalizeQuality(quality) {
  if (MOVABLE_TEMPLATES[quality] !== undefined) return quality;
  if (QUALITY_ALIASES[quality] !== undefined) return QUALITY_ALIASES[quality];
  if (quality.includes('m7b5') || quality.includes('ø')) return 'm7b5';
  if (quality.includes('dim7')) return 'dim7';
  if (quality.includes('dim')) return 'dim';
  if (quality.includes('maj7#5') || quality.includes('maj7+')) return 'maj7#5';
  if (quality.includes('maj7#11')) return 'maj7#11';
  if (quality.includes('mMaj7') || quality.includes('m(maj7)')) return 'mMaj7';
  if (quality.includes('7#9')) return '7#9';
  if (quality.includes('7b9')) return '7b9';
  if (quality.includes('7alt')) return '7alt';
  if (quality.includes('7#11')) return '7#11';
  if (quality.includes('7b5')) return '7b5';
  if (quality.includes('7sus4')) return '7sus4';
  if (quality.includes('sus4')) return 'sus4';
  if (quality.includes('sus2')) return 'sus2';
  if (quality.includes('13')) return '13';
  if (quality.includes('m9')) return 'm9';
  if (quality.includes('9')) return '9';
  if (quality.includes('maj7')) return 'maj7';
  if (quality.includes('m7')) return 'm7';
  if (quality.includes('m6')) return 'm6';
  if (quality.includes('6')) return '6';
  if (quality.includes('aug')) return 'aug';
  if (quality.includes('7')) return '7';
  if (quality.startsWith('m')) return 'm';
  return '';
}

/**
 * Build a finalized voicing object (frets, baseFret, midiNotes, name) from a raw fret array.
 */
function buildVoicing(frets, rootNote, rawQuality) {
  const fretted = frets.filter((f) => f > 0);
  const maxFret = fretted.length ? Math.max(...fretted) : 0;
  const minFret = fretted.length ? Math.min(...fretted) : 1;
  const baseFret = maxFret <= 4 ? 1 : minFret;
  const midiNotes = [];
  frets.forEach((fret, stringIdx) => {
    if (fret >= 0) midiNotes.push(OPEN_STRING_MIDI[stringIdx] + fret);
  });
  return { frets, baseFret, midiNotes, name: `${rootNote}${rawQuality}` };
}

/**
 * Return up to 3 distinct voicings for a chord: open position (if available),
 * then all movable-template shapes in ascending fret order.
 */
function getAllChordVoicings(rootNote, rawQuality) {
  const pitch = NOTE_TO_PITCH[rootNote] ?? 0;
  const quality = normalizeQuality(rawQuality || '');
  const voicings = [];

  // 1. Open voicing first (if this root has one)
  const naturalKey = PITCH_TO_NATURAL_OPEN_KEY[pitch];
  if (naturalKey && OPEN_VOICINGS[`${naturalKey}:${quality}`]) {
    voicings.push(buildVoicing(OPEN_VOICINGS[`${naturalKey}:${quality}`], rootNote, rawQuality));
  }

  // 2. All movable template shapes, in ascending max-fret order
  const templates = MOVABLE_TEMPLATES[quality] || MOVABLE_TEMPLATES[''];
  const shaped = [];
  for (const tmpl of templates) {
    let r = (pitch - tmpl.basePitch + 12) % 12;
    if (r < tmpl.minR) r += 12;
    const shape = tmpl.offsets.map((off) => (off === null ? -1 : r + off));
    if (shape.some((f) => f < -1)) continue;
    const fretted = shape.filter((f) => f > 0);
    if (!fretted.length) continue;
    const maxFret = Math.max(...fretted);
    // Skip if already represented by the open voicing above
    const isDuplicate = voicings.some((v) => v.frets.join() === shape.join());
    if (!isDuplicate) shaped.push({ shape, maxFret });
  }
  shaped.sort((a, b) => a.maxFret - b.maxFret);
  for (const { shape } of shaped) {
    voicings.push(buildVoicing(shape, rootNote, rawQuality));
  }

  // Always have at least one voicing
  if (voicings.length === 0) {
    voicings.push(getChordVoicing(rootNote, rawQuality));
  }

  return voicings;
}

function getChordVoicing(rootNote, rawQuality) {
  const pitch = NOTE_TO_PITCH[rootNote] ?? 0;
  const quality = normalizeQuality(rawQuality || '');

  const naturalKey = PITCH_TO_NATURAL_OPEN_KEY[pitch];
  let frets = null;

  if (naturalKey && OPEN_VOICINGS[`${naturalKey}:${quality}`]) {
    frets = OPEN_VOICINGS[`${naturalKey}:${quality}`];
  } else {
    const candidates = MOVABLE_TEMPLATES[quality] || MOVABLE_TEMPLATES[''];
    let bestCandidate = null;
    let bestMaxFret = 99;

    for (const tmpl of candidates) {
      let r = (pitch - tmpl.basePitch + 12) % 12;
      if (r < tmpl.minR) r += 12;

      const shape = tmpl.offsets.map((off) => (off === null ? -1 : r + off));
      if (shape.some((f) => f < -1)) continue;

      const fretted = shape.filter((f) => f > 0);
      const maxFret = fretted.length ? Math.max(...fretted) : 0;
      const minFret = fretted.length ? Math.min(...fretted) : 0;
      const hasOpen = shape.some((f) => f === 0);

      if (hasOpen && maxFret > 4) continue;
      if (fretted.length && maxFret - minFret > 3) continue;

      if (maxFret < bestMaxFret) {
        bestMaxFret = maxFret;
        bestCandidate = shape;
      }
    }

    if (!bestCandidate) {
      const fallbackTmpl = quality.startsWith('m')
        ? MOVABLE_TEMPLATES.m[0]
        : quality.includes('7')
        ? MOVABLE_TEMPLATES['7'][0]
        : MOVABLE_TEMPLATES[''][0];
      let r = (pitch - fallbackTmpl.basePitch + 12) % 12;
      if (r < fallbackTmpl.minR) r += 12;
      bestCandidate = fallbackTmpl.offsets.map((off) => (off === null ? -1 : r + off));
    }

    frets = bestCandidate;
  }

  const fretted = frets.filter((f) => f > 0);
  const maxFret = fretted.length ? Math.max(...fretted) : 0;
  const minFret = fretted.length ? Math.min(...fretted) : 1;
  const baseFret = maxFret <= 4 ? 1 : minFret;

  const midiNotes = [];
  frets.forEach((fret, stringIdx) => {
    if (fret >= 0) {
      midiNotes.push(OPEN_STRING_MIDI[stringIdx] + fret);
    }
  });

  return {
    frets,
    baseFret,
    midiNotes,
    name: `${rootNote}${rawQuality}`,
  };
}

class GuitarAudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.activeTimers = [];
    this.activeNodes = new Set();
    this.unlocked = false;
    this.instrument = 'guitar';
    this._bindGestureUnlock();
  }

  setInstrument(name) {
    if (!INSTRUMENT_PRESETS[name]) return;
    this.instrument = name;
    if (this.masterGain && this.ctx) {
      const preset = INSTRUMENT_PRESETS[name];
      this.masterGain.gain.setTargetAtTime(preset.masterGain, this.ctx.currentTime, 0.05);
    }
  }

  _bindGestureUnlock() {
    if (typeof window === 'undefined') return;
    // Keep gesture listeners alive permanently so we can re-resume the
    // AudioContext after it is suspended by an OS audio interruption
    // (phone call, another media app taking focus, etc.).
    const onGesture = () => {
      if (!this.ctx) {
        this.unlock();
        return;
      }
      if (this.ctx.state !== 'running') {
        this.ctx.resume().catch(() => {});
      }
      if (!this.unlocked) {
        this.unlock();
      }
    };
    window.addEventListener('touchstart', onGesture, { capture: true, passive: true });
    window.addEventListener('pointerdown', onGesture, { capture: true, passive: true });
    window.addEventListener('click', onGesture, { capture: true, passive: true });
  }

  unlock() {
    if (typeof navigator !== 'undefined' && navigator.audioSession) {
      try {
        navigator.audioSession.type = 'playback';
      } catch {}
    }
    const ctx = this.ensureContext();
    if (!ctx) return null;

    if (!this.unlocked) {
      try {
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        this.unlocked = true;
      } catch {}
    }
    return ctx;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      try {
        this.ctx = new AudioCtx({ latencyHint: 'interactive' });
      } catch {
        this.ctx = new AudioCtx();
      }
      this.masterGain = this.ctx.createGain();
      const initPreset = INSTRUMENT_PRESETS[this.instrument] || INSTRUMENT_PRESETS.guitar;
      this.masterGain.gain.setValueAtTime(initPreset.masterGain, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);

      // When the OS interrupts audio (another app, phone call, etc.) the
      // browser suspends the AudioContext. Mark it as needing re-unlock so
      // the next user gesture automatically resumes playback.
      this.ctx.onstatechange = () => {
        if (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted') {
          this.unlocked = false;
        }
      };
    }
    if (this.ctx.state !== 'running') {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  midiToFreq(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  playStringNote(midi, startTime, duration = 1.45) {
    const ctx = this.ensureContext();
    const freq = this.midiToFreq(midi);
    const preset = INSTRUMENT_PRESETS[this.instrument] || INSTRUMENT_PRESETS.guitar;
    const { osc1, osc2, filter: flt, env } = preset;

    // Primary oscillator
    const triOsc = ctx.createOscillator();
    triOsc.type = osc1.type;
    triOsc.frequency.setValueAtTime(freq, startTime);

    // Secondary oscillator (chorus / harmonic texture)
    const sawOsc = ctx.createOscillator();
    sawOsc.type = osc2.type;
    sawOsc.frequency.setValueAtTime(freq, startTime);
    sawOsc.detune.setValueAtTime(osc2.detune, startTime);

    const triGain = ctx.createGain();
    triGain.gain.setValueAtTime(osc1.gainAmt, startTime);

    const sawGain = ctx.createGain();
    sawGain.gain.setValueAtTime(osc2.gainAmt, startTime);

    // Lowpass filter with pluck brightness envelope
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.setValueAtTime(flt.Q, startTime);
    const startCutoff = Math.min(flt.startMax, freq * flt.startMult);
    const endCutoff = Math.max(flt.endMax, freq * flt.endMult);
    filter.frequency.setValueAtTime(startCutoff, startTime);
    filter.frequency.exponentialRampToValueAtTime(endCutoff, startTime + duration * env.filterDecayFrac);

    // Amplitude ADSR-like pluck decay
    const noteGain = ctx.createGain();
    noteGain.gain.setValueAtTime(0.0001, startTime);
    noteGain.gain.linearRampToValueAtTime(env.peak, startTime + env.attack);
    noteGain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

    triOsc.connect(triGain);
    sawOsc.connect(sawGain);
    triGain.connect(filter);
    sawGain.connect(filter);
    filter.connect(noteGain);
    noteGain.connect(this.masterGain);

    triOsc.start(startTime);
    sawOsc.start(startTime);
    const stopTime = startTime + duration + 0.05;
    triOsc.stop(stopTime);
    sawOsc.stop(stopTime);

    const entry = { triOsc, sawOsc, noteGain };
    this.activeNodes.add(entry);
    triOsc.onended = () => {
      this.activeNodes.delete(entry);
    };
  }

  /**
   * Play a chord's MIDI notes using Strum (35ms) or Arpeggio (140ms) offset.
   */
  playChord(midiNotes, mode = 'strum', beatDurationSec = 1.3) {
    if (!midiNotes || midiNotes.length === 0) return;
    const ctx = this.unlock();
    if (!ctx) return;

    const schedule = () => {
      const now = Math.max(ctx.currentTime + 0.02, 0.02);
      const offsetSec = mode === 'arpeggio' ? 0.14 : 0.035;
      const noteDuration = Math.max(1.1, beatDurationSec * 1.15);

      midiNotes.forEach((midi, idx) => {
        const noteStart = now + idx * offsetSec;
        this.playStringNote(midi, noteStart, noteDuration);
      });
    };

    if (ctx.state === 'running') {
      schedule();
    } else {
      ctx.resume().then(schedule).catch(() => {});
    }
  }

  playSingleNote(midi, duration = 1.1) {
    const ctx = this.unlock();
    if (!ctx) return;

    const schedule = () => {
      const now = Math.max(ctx.currentTime + 0.015, 0.015);
      this.playStringNote(midi, now, duration);
    };

    if (ctx.state === 'running') {
      schedule();
    } else {
      ctx.resume().then(schedule).catch(() => {});
    }
  }

  stopAllNotes() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (const entry of this.activeNodes) {
      try {
        entry.noteGain.gain.cancelScheduledValues(now);
        entry.noteGain.gain.setTargetAtTime(0.0001, now, 0.02);
        entry.triOsc.stop(now + 0.08);
        entry.sawOsc.stop(now + 0.08);
      } catch {
        // Already stopped
      }
    }
    this.activeNodes.clear();
  }
}

      // =========================================================================
      // 6. SVG GUITAR CHORD VOICING DIAGRAM (6 strings, 4 frets)
      // =========================================================================
      function ChordDiagram({ chord, isActive, onPlay }) {
        const voicings = useMemo(
          () => getAllChordVoicings(chord.root, chord.quality),
          [chord.root, chord.quality]
        );
        const [voicingIdx, setVoicingIdx] = useState(0);
        const safeIdx = Math.min(voicingIdx, voicings.length - 1);
        const voicing = voicings[safeIdx];
        const { frets, baseFret } = voicing;

        const goTo = (idx, e) => {
          e.stopPropagation();
          setVoicingIdx(((idx % voicings.length) + voicings.length) % voicings.length);
        };

        // SVG geometry
        const leftPad = 24;
        const topPad = 22;
        const stringGap = 15; // 5 gaps * 15 = 75px width
        const fretGap = 19;   // 4 frets * 19 = 76px height
        const width = leftPad + stringGap * 5 + 14;
        const height = topPad + fretGap * 4 + 14;

        return (
          <button
            type="button"
            onClick={() => onPlay(voicing.midiNotes)}
            title={`Play ${chord.name}`}
            className={`shrink-0 flex flex-col items-center rounded-xl border p-2.5 transition-all active:scale-95 ${
              isActive
                ? 'bg-amber-500/10 border-amber-500/60 shadow-[0_0_12px_rgba(245,158,11,0.18)]'
                : 'bg-zinc-950/80 border-zinc-800 hover:border-zinc-700'
            }`}
          >
            {/* Header: prev arrow · chord name · next arrow */}
            <div className="flex items-center w-full justify-between gap-0.5 mb-1">
              <button
                type="button"
                onClick={(e) => goTo(safeIdx - 1, e)}
                aria-label="Previous voicing"
                disabled={voicings.length <= 1}
                className={`w-6 h-6 flex items-center justify-center rounded-md text-sm font-bold leading-none transition-colors ${
                  voicings.length > 1 ? 'text-zinc-400 hover:text-amber-400 hover:bg-zinc-800 active:scale-95' : 'text-zinc-700 cursor-default'
                }`}
              >&#8249;</button>
              <div className="flex items-baseline gap-1 min-w-0">
                <span className="text-xs font-bold text-zinc-100 tracking-tight">{chord.name}</span>
                <span className="text-[10px] font-mono text-zinc-500">{chord.roman}</span>
              </div>
              <button
                type="button"
                onClick={(e) => goTo(safeIdx + 1, e)}
                aria-label="Next voicing"
                disabled={voicings.length <= 1}
                className={`w-6 h-6 flex items-center justify-center rounded-md text-sm font-bold leading-none transition-colors ${
                  voicings.length > 1 ? 'text-zinc-400 hover:text-amber-400 hover:bg-zinc-800 active:scale-95' : 'text-zinc-700 cursor-default'
                }`}
              >&#8250;</button>
            </div>

            <svg
              width={width}
              height={height}
              viewBox={`0 0 ${width} ${height}`}
              className="overflow-visible select-none"
              role="img"
              aria-label={`${chord.name} guitar chord diagram`}
            >
              {/* Fret position label when shifted up the neck */}
              {baseFret > 1 && (
                <text
                  x={leftPad - 5}
                  y={topPad + fretGap * 0.65}
                  textAnchor="end"
                  className="fill-amber-400 font-mono font-semibold"
                  style={{ fontSize: '10px' }}
                >
                  {baseFret}fr
                </text>
              )}

              {/* Nut or top fret line */}
              <line
                x1={leftPad}
                y1={topPad}
                x2={leftPad + stringGap * 5}
                y2={topPad}
                stroke={baseFret === 1 ? '#e4e4e7' : '#52525b'}
                strokeWidth={baseFret === 1 ? 3.5 : 1.5}
                strokeLinecap="round"
              />

              {/* 4 Horizontal Fret Lines */}
              {[1, 2, 3, 4].map((fretIdx) => {
                const y = topPad + fretIdx * fretGap;
                return (
                  <line
                    key={fretIdx}
                    x1={leftPad}
                    y1={y}
                    x2={leftPad + stringGap * 5}
                    y2={y}
                    stroke="#3f3f46"
                    strokeWidth="1.2"
                  />
                );
              })}

              {/* 6 Vertical String Lines */}
              {[0, 1, 2, 3, 4, 5].map((strIdx) => {
                const x = leftPad + strIdx * stringGap;
                return (
                  <line
                    key={strIdx}
                    x1={x}
                    y1={topPad}
                    x2={x}
                    y2={topPad + fretGap * 4}
                    stroke="#52525b"
                    strokeWidth={strIdx < 2 ? '1.6' : '1.1'}
                  />
                );
              })}

              {/* Open / Muted Markers & Finger Dots */}
              {frets.map((fret, strIdx) => {
                const x = leftPad + strIdx * stringGap;
                if (fret === -1) {
                  return (
                    <g key={strIdx} stroke="#71717a" strokeWidth="1.6" strokeLinecap="round">
                      <line x1={x - 3.5} y1={topPad - 13} x2={x + 3.5} y2={topPad - 6} />
                      <line x1={x + 3.5} y1={topPad - 13} x2={x - 3.5} y2={topPad - 6} />
                    </g>
                  );
                }
                if (fret === 0) {
                  return (
                    <circle
                      key={strIdx}
                      cx={x}
                      cy={topPad - 9.5}
                      r="3.8"
                      fill="none"
                      stroke="#a1a1aa"
                      strokeWidth="1.6"
                    />
                  );
                }
                const relFret = fret - baseFret + 1;
                if (relFret < 1 || relFret > 4) return null;
                const y = topPad + (relFret - 0.5) * fretGap;
                return (
                  <circle
                    key={strIdx}
                    cx={x}
                    cy={y}
                    r="5.2"
                    fill="#f59e0b"
                    stroke="#18181b"
                    strokeWidth="1.2"
                  />
                );
              })}
            </svg>
            {/* Voicing dot indicators */}
            {voicings.length > 1 && (
              <div className="flex items-center gap-1 mt-2" role="tablist" aria-label="Voicing selector">
                {voicings.map((_, i) => (
                  <button
                    key={i}
                    type="button"
                    role="tab"
                    aria-selected={i === safeIdx}
                    aria-label={`Voicing ${i + 1}`}
                    onClick={(e) => { e.stopPropagation(); setVoicingIdx(i); }}
                    className={`rounded-full transition-all ${
                      i === safeIdx
                        ? 'w-3.5 h-2 bg-amber-400'
                        : 'w-2 h-2 bg-zinc-600 hover:bg-zinc-500'
                    }`}
                  />
                ))}
              </div>
            )}
          </button>
        );
      }

      // =========================================================================
      // 6B. INTERACTIVE SOLO FRETBOARD DIAGRAM (Frets 1–12)
      // =========================================================================
      function ScaleFretboard({ mode, selectedKey, theme }) {
        const [labelMode, setLabelMode] = useState('notes'); // 'notes' | 'intervals'
        const [activeDotKey, setActiveDotKey] = useState(null);
        const dotTimerRef = useRef(null);

        const { ordered, pitchMap } = useMemo(
          () => getModeScaleNotes(selectedKey, mode.formula),
          [selectedKey, mode.formula]
        );

        useEffect(() => {
          return () => {
            if (dotTimerRef.current) clearTimeout(dotTimerRef.current);
          };
        }, []);

        const handleNoteClick = (dotKey, midi) => {
          audioEngine.playSingleNote(midi, 1.05);
          setActiveDotKey(dotKey);
          if (dotTimerRef.current) clearTimeout(dotTimerRef.current);
          dotTimerRef.current = setTimeout(() => setActiveDotKey(null), 320);
        };

        // Fretboard geometry: 6 strings (top = high e [idx 5], bottom = low E [idx 0]), open (0) + frets 1..12
        const stringLabelX = 12;
        const openDotX = 36;
        const leftPad = 56;
        const topPad = 24;
        const fretWidth = 44; // 12 * 44 = 528
        const stringGap = 26; // 5 * 26 = 130
        const width = leftPad + fretWidth * 12 + 12;
        const height = topPad + stringGap * 5 + 18;
        const stringLabels = ['e', 'B', 'G', 'D', 'A', 'E']; // top to bottom
        const singleInlays = [3, 5, 7, 9];

        return (
          <div className="rounded-xl bg-zinc-950/90 border border-zinc-800/90 p-3 space-y-2.5">
            {/* Top Controls & Legend */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                {ordered.map((item) => (
                  <span
                    key={item.pitchClass}
                    className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-mono font-semibold border ${
                      item.isRoot
                        ? 'text-zinc-950 border-transparent'
                        : 'bg-zinc-900 text-zinc-200 border-zinc-800'
                    }`}
                    style={item.isRoot ? { backgroundColor: theme.hex } : undefined}
                  >
                    {item.note}
                    {item.isRoot && <span className="text-[9px] font-sans uppercase opacity-80">R</span>}
                  </span>
                ))}
              </div>

              <div
                className="inline-flex rounded-lg bg-zinc-900 border border-zinc-800 p-0.5 shrink-0"
                role="group"
                aria-label="Fretboard label mode"
              >
                <button
                  type="button"
                  onClick={() => setLabelMode('notes')}
                  className={`px-2 py-1 rounded-md text-[11px] font-medium transition-colors ${
                    labelMode === 'notes'
                      ? 'bg-zinc-700 text-zinc-100'
                      : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  Notes
                </button>
                <button
                  type="button"
                  onClick={() => setLabelMode('intervals')}
                  className={`px-2 py-1 rounded-md text-[11px] font-medium transition-colors ${
                    labelMode === 'intervals'
                      ? 'bg-zinc-700 text-zinc-100'
                      : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  Intervals
                </button>
              </div>
            </div>

            {/* Horizontal Scrollable 1–12 Fret SVG */}
            <div className="overflow-x-auto pb-1.5 thin-scrollbar">
              <svg
                width={width}
                height={height}
                viewBox={`0 0 ${width} ${height}`}
                className="min-w-[596px] select-none"
                role="img"
                aria-label={`${selectedKey} ${mode.name} soloing notes on open strings and frets 1 to 12`}
              >
                {/* Fretboard wood/dark surface */}
                <rect
                  x={leftPad}
                  y={topPad}
                  width={fretWidth * 12}
                  height={stringGap * 5}
                  rx="4"
                  fill="#0c0c0f"
                />

                {/* Open string column label + Fret numbers 1–12 */}
                <text
                  x={openDotX}
                  y={14}
                  textAnchor="middle"
                  fill="#71717a"
                  style={{ fontSize: '10px', fontFamily: 'JetBrains Mono, monospace', fontWeight: 600 }}
                >
                  0
                </text>
                {Array.from({ length: 12 }, (_, i) => i + 1).map((fretNum) => {
                  const cx = leftPad + (fretNum - 0.5) * fretWidth;
                  return (
                    <text
                      key={`fnum-${fretNum}`}
                      x={cx}
                      y={14}
                      textAnchor="middle"
                      fill={fretNum === 12 || singleInlays.includes(fretNum) ? '#a1a1aa' : '#52525b'}
                      style={{ fontSize: '10px', fontFamily: 'JetBrains Mono, monospace', fontWeight: 600 }}
                    >
                      {fretNum}
                    </text>
                  );
                })}

                {/* Fret inlay markers */}
                {singleInlays.map((fretNum) => (
                  <circle
                    key={`inlay-${fretNum}`}
                    cx={leftPad + (fretNum - 0.5) * fretWidth}
                    cy={topPad + stringGap * 2.5}
                    r="4.5"
                    fill="#27272a"
                  />
                ))}
                <circle
                  cx={leftPad + 11.5 * fretWidth}
                  cy={topPad + stringGap * 1.5}
                  r="4.5"
                  fill="#27272a"
                />
                <circle
                  cx={leftPad + 11.5 * fretWidth}
                  cy={topPad + stringGap * 3.5}
                  r="4.5"
                  fill="#27272a"
                />

                {/* Nut + 12 Fret Wires */}
                <line
                  x1={leftPad}
                  y1={topPad}
                  x2={leftPad}
                  y2={topPad + stringGap * 5}
                  stroke="#e4e4e7"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                />
                {Array.from({ length: 12 }, (_, i) => i + 1).map((fretNum) => {
                  const x = leftPad + fretNum * fretWidth;
                  return (
                    <line
                      key={`fwire-${fretNum}`}
                      x1={x}
                      y1={topPad}
                      x2={x}
                      y2={topPad + stringGap * 5}
                      stroke={fretNum === 12 ? '#52525b' : '#27272a'}
                      strokeWidth={fretNum === 12 ? '2' : '1.4'}
                    />
                  );
                })}

                {/* 6 Strings (high e on top -> low E on bottom) + String Labels */}
                {stringLabels.map((lbl, rowIdx) => {
                  const y = topPad + rowIdx * stringGap;
                  return (
                    <g key={`str-${lbl}-${rowIdx}`}>
                      <text
                        x={stringLabelX}
                        y={y + 3.5}
                        textAnchor="middle"
                        fill="#71717a"
                        style={{ fontSize: '11px', fontFamily: 'JetBrains Mono, monospace', fontWeight: 600 }}
                      >
                        {lbl}
                      </text>
                      <line
                        x1={openDotX}
                        y1={y}
                        x2={leftPad}
                        y2={y}
                        stroke="#27272a"
                        strokeDasharray="2 2"
                        strokeWidth={0.9 + rowIdx * 0.2}
                      />
                      <line
                        x1={leftPad}
                        y1={y}
                        x2={leftPad + fretWidth * 12}
                        y2={y}
                        stroke="#3f3f46"
                        strokeWidth={0.9 + rowIdx * 0.25}
                      />
                    </g>
                  );
                })}

                {/* Scale Note Dots across Open Strings (0) & Frets 1–12 */}
                {Array.from({ length: 6 }, (_, rowIdx) => {
                  const stringIdx = 5 - rowIdx; // row 0 = high e (OPEN_STRING_MIDI[5]), row 5 = low E (OPEN_STRING_MIDI[0])
                  const openMidi = OPEN_STRING_MIDI[stringIdx];
                  const y = topPad + rowIdx * stringGap;

                  return Array.from({ length: 13 }, (__, fretNum) => {
                    const midi = openMidi + fretNum;
                    const pitchClass = midi % 12;
                    const scaleNote = pitchMap[pitchClass];
                    if (!scaleNote) return null;

                    const cx = fretNum === 0 ? openDotX : leftPad + (fretNum - 0.5) * fretWidth;
                    const dotKey = `${stringIdx}-${fretNum}`;
                    const isFlashed = activeDotKey === dotKey;
                    const labelText = labelMode === 'notes' ? scaleNote.note : scaleNote.interval;

                    return (
                      <g
                        key={dotKey}
                        onClick={() => handleNoteClick(dotKey, midi)}
                        className="cursor-pointer"
                        role="button"
                        aria-label={`${fretNum === 0 ? 'Open' : `Fret ${fretNum}`} string ${stringLabels[rowIdx]}: ${scaleNote.note}`}

                          r={scaleNote.isRoot ? 10.5 : 9.2}

                          stroke={scaleNote.isRoot ? '#fef3c7' : theme.hex}

                          style={{

                            pointerEvents: 'none',

                          {labelText}
                        </text>
                      </g>
                    );
                  });
                })}

      // =========================================================================
      // 8B. HORIZONTAL PILL STRIP (Touch swipe + mouse wheel + desktop arrows)
      // =========================================================================
      function HorizontalPillStrip({ items, selectedId, onSelect, ariaLabel }) {
        const scrollRef = useRef(null);
        const [canLeft, setCanLeft] = useState(false);
        const [canRight, setCanRight] = useState(false);

        const updateArrows = useCallback(() => {
          const el = scrollRef.current;
          if (!el) return;
          setCanLeft(el.scrollLeft > 4);
          setCanRight(el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
        }, []);

        useEffect(() => {
          const el = scrollRef.current;
          if (!el) return;
          updateArrows();

          const onWheel = (e) => {
            if (el.scrollWidth <= el.clientWidth) return;
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
              e.preventDefault();
              el.scrollLeft += e.deltaY;
            }
          };

          el.addEventListener('wheel', onWheel, { passive: false });
          window.addEventListener('resize', updateArrows);

          let ro = null;
          if (typeof ResizeObserver !== 'undefined') {
            ro = new ResizeObserver(updateArrows);
            ro.observe(el);
          }

          return () => {
            el.removeEventListener('wheel', onWheel);
            window.removeEventListener('resize', updateArrows);
            if (ro) ro.disconnect();
          };
        }, [updateArrows, items]);

        const scrollByAmount = (delta) => {
          const el = scrollRef.current;
          if (!el) return;
          el.scrollBy({ left: delta, behavior: 'smooth' });
        };

        return (
          <div className="relative flex items-start gap-1.5">
            {canLeft && (
              <button
                type="button"
                onClick={() => scrollByAmount(-220)}
                aria-label="Scroll left"
                className="hidden sm:flex shrink-0 h-10 w-8 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-zinc-100 items-center justify-center text-base font-semibold transition-colors"
              >
                ‹
              </button>
            )}

            <div
              ref={scrollRef}
              onScroll={updateArrows}
              className="flex-1 min-w-0 flex gap-2 overflow-x-auto pb-1.5 thin-scrollbar"
              style={{ WebkitOverflowScrolling: 'touch', touchAction: 'pan-x' }}
              role="group"
              aria-label={ariaLabel}
            >
              {items.map((item) => {
                const active = selectedId === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => onSelect(item.id)}
                    className={`shrink-0 h-10 px-4 rounded-xl text-xs sm:text-sm font-semibold border transition-all ${
                      active
                        ? 'bg-amber-500/15 border-amber-500 text-amber-300'
                        : 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700'
                    }`}
                  >
                    {item.label}
                  </button>
                );
              })}
            </div>

            {canRight && (
              <button
                type="button"
                onClick={() => scrollByAmount(220)}
                aria-label="Scroll right"
                className="hidden sm:flex shrink-0 h-10 w-8 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-zinc-100 items-center justify-center text-base font-semibold transition-colors"
              >
                ›
              </button>
            )}
          </div>
        );
      }

      // =========================================================================
      // 9. FAVORITES HOOK + PROGRESSION LOOKUP MAP
      // =========================================================================
      // Build a flat id -> { progression, source } map once at load time
      const ALL_PROGRESSIONS_MAP = (() => {
        const map = {};
        SCALE_GROUPS.forEach((g) => {
          g.modes.forEach((mode) => {
            mode.progressions.forEach((prog, pIdx) => {
              const id = `${g.id}-${mode.number}-${pIdx}`;
              map[id] = { progression: prog, source: `${g.name} \u2014 ${mode.name}` };
            });
          });
        });
        DOMINANT_PROGRESSIONS.forEach((prog) => {
          const id = `dom-${prog.id}`;
          map[id] = { progression: prog, source: prog.category };
        });
        return map;
      })();

      const FAVORITES_KEY = 'modaly-favorites-v1';

      function useFavorites() {
        const [favorites, setFavorites] = useState(() => {
          try {
            const raw = localStorage.getItem(FAVORITES_KEY);
            return raw ? new Set(JSON.parse(raw)) : new Set();
          } catch {
            return new Set();
          }
        });

        const toggleFavorite = useCallback((progId) => {
          setFavorites((prev) => {
            const next = new Set(prev);
            if (next.has(progId)) {
              next.delete(progId);
            } else {
              next.add(progId);
            }
            try {
              localStorage.setItem(FAVORITES_KEY, JSON.stringify([...next]));
            } catch {}
            return next;
          });
        }, []);

        return { favorites, toggleFavorite };
      }

      // =========================================================================
      // 9. MAIN APP
      // =========================================================================
      function App() {
        const [selectedKey, setSelectedKey] = useState('C');
        const [activeTab, setActiveTab] = useState('modal'); // 'modal' | 'dominant' | 'favorites'
        const [selectedGroupId, setSelectedGroupId] = useState('major');
        const [expandedModeKey, setExpandedModeKey] = useState(null);
        const [domCategory, setDomCategory] = useState('Blues & Funk');
        const { favorites, toggleFavorite } = useFavorites();
        const [settingsOpen, setSettingsOpen] = useState(false);
        const [settingsView, setSettingsView] = useState('playback'); // 'playback' | 'about'

        // Audio / Playback state
        const [playMode, setPlayMode] = useState('strum'); // 'strum' | 'arpeggio'
        const [instrument, setInstrumentState] = useState('guitar');
        const handleSetInstrument = useCallback((name) => {
          setInstrumentState(name);
          audioEngine.setInstrument(name);
        }, []);
        const [bpm, setBpm] = useState(92);
        const [playingProgId, setPlayingProgId] = useState(null);
        const [activeChordIdx, setActiveChordIdx] = useState(-1);

        const loopTimerRef = useRef(null);
        const loopStateRef = useRef({
          progId: null,
          chords: [],
          step: 0,
        });

        const stopPlayback = useCallback(() => {
          if (loopTimerRef.current) {
            clearInterval(loopTimerRef.current);
            loopTimerRef.current = null;
          }
          loopStateRef.current = { progId: null, chords: [], step: 0 };
          setPlayingProgId(null);
          setActiveChordIdx(-1);
          audioEngine.stopAllNotes();
        }, []);

        const playSingleChord = useCallback(
          (midiNotes) => {
            const beatSec = (60 / bpm) * 2;
            audioEngine.playChord(midiNotes, playMode, beatSec);
          },
          [bpm, playMode]
        );

        const startOrRestartLoop = useCallback(
          (progId, transposedChords, resetStep = true) => {
            if (loopTimerRef.current) {
              clearInterval(loopTimerRef.current);
              loopTimerRef.current = null;
            }
            const beatMs = (60 / bpm) * 2 * 1000; // 2 beats per chord
            const beatSec = beatMs / 1000;

            const startIdx = resetStep ? 0 : loopStateRef.current.step % transposedChords.length;
            loopStateRef.current = {
              progId,
              chords: transposedChords,
              step: startIdx,
            };

            const triggerStep = () => {
              const st = loopStateRef.current;
              if (!st.chords.length) return;
              const idx = st.step % st.chords.length;
              setActiveChordIdx(idx);
              audioEngine.playChord(st.chords[idx].voicing.midiNotes, playMode, beatSec);
              st.step = (idx + 1) % st.chords.length;
            };

            setPlayingProgId(progId);
            if (resetStep) {
              triggerStep();
            }
            loopTimerRef.current = setInterval(triggerStep, beatMs);
          },
          [bpm, playMode]
        );

        const handleTogglePlay = useCallback(
          (progId, transposedChords) => {
            audioEngine.unlock();
            if (playingProgId === progId) {
              stopPlayback();
            } else {
              startOrRestartLoop(progId, transposedChords, true);
            }
          },
          [playingProgId, stopPlayback, startOrRestartLoop]
        );

        // Live-update loop speed, strum/arpeggio, or transposed chords if key/BPM/mode changes while playing
        useEffect(() => {
          if (!playingProgId) return;
          // Re-resolve active chords in current key if key changed
          const updatedChords = loopStateRef.current.chords.map((c) => {
            const chord = transposeRomanChord(c.roman, selectedKey);
            const voicing = getChordVoicing(chord.root, chord.quality);
            return { ...chord, voicing };
          });
          if (updatedChords.length) {
            startOrRestartLoop(playingProgId, updatedChords, false);
          }
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [bpm, playMode, selectedKey]);

        useEffect(() => {
          return () => {
            if (loopTimerRef.current) clearInterval(loopTimerRef.current);
          };
        }, []);

        useEffect(() => {
          if (!settingsOpen) {
            setSettingsView('playback');
            return;
          }
          const onKeyDown = (e) => {
            if (e.key === 'Escape') setSettingsOpen(false);
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [settingsOpen]);

        const currentGroup = useMemo(
          () => SCALE_GROUPS.find((g) => g.id === selectedGroupId) || SCALE_GROUPS[0],
          [selectedGroupId]
        );

        const handleSelectGroup = (groupId) => {
          stopPlayback();
          setSelectedGroupId(groupId);
          setExpandedModeKey(null);
        };

        const handleSwitchTab = (tab) => {
          if (tab !== activeTab) {
            stopPlayback();
            setActiveTab(tab);
          }
        };

        const filteredDominantProgs = useMemo(() => {
          return DOMINANT_PROGRESSIONS.filter((p) => p.category === domCategory);
        }, [domCategory]);

        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 pb-16">

                {/* Brand + Upper-Right Settings Menu */}
                <div className="flex items-center justify-between gap-2 relative">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="w-8 h-8 shrink-0 rounded-xl bg-amber-500 flex items-center justify-center text-zinc-950 font-black text-base shadow-[0_0_16px_rgba(245,158,11,0.3)]">
                      M
                    </div>
                    <div className="min-w-0">
                      <h1 className="text-lg font-bold tracking-tight text-zinc-50 leading-none">
                        Modaly
                      </h1>
                      <p className="text-[11px] text-zinc-400 mt-0.5 truncate">
                        Key of <span className="text-amber-400 font-semibold">{selectedKey}</span>
                      </p>
                    </div>
                  </div>

                  {/* Upper-Right Menu Button */}
                  <button
                    type="button"
                    onClick={() => setSettingsOpen((prev) => !prev)}
                    aria-label="Playback settings menu"
                    aria-expanded={settingsOpen}
                    className={`h-10 w-10 shrink-0 rounded-xl border flex items-center justify-center transition-colors active:scale-95 ${
                      settingsOpen
                        ? 'bg-amber-500/15 border-amber-500 text-amber-300'
                        : 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700 hover:text-zinc-100'
                    }`}
                  >
                    {settingsOpen ? <CloseIcon className="w-5 h-5" /> : <MenuIcon className="w-5 h-5" />}
                  </button>

                  {/* Settings View Popover / Drawer */}
                  {settingsOpen && (
                    <>
                      <div
                        className="fixed inset-0 z-40 bg-black/50 backdrop-blur-[1px]"
                        onClick={() => setSettingsOpen(false)}
                        aria-hidden="true"
                      />
                      <div
                        role="dialog"
                        aria-label={settingsView === 'about' ? 'About Modaly' : 'Settings'}
                        className="absolute right-0 top-12 z-50 w-72 sm:w-80 rounded-2xl bg-zinc-900 border border-zinc-700 shadow-2xl p-4 space-y-4"
                      >
                        {settingsView === 'playback' ? (
                          <>
                            <div className="flex items-center justify-between border-b border-zinc-800 pb-2.5">
                              <h2 className="text-sm font-semibold text-zinc-100">
                                Settings
                              </h2>
                              <button
                                type="button"
                                onClick={() => setSettingsOpen(false)}
                                aria-label="Close settings"
                                className="h-8 w-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center"
                              >
                                <CloseIcon className="w-4 h-4" />
                              </button>
                            </div>

                            {/* Instrument Picker */}
                            <div className="space-y-1.5">
                              <label className="text-xs font-medium text-zinc-400 block">
                                Instrument
                              </label>
                              <div
                                className="grid grid-cols-5 gap-1 rounded-xl bg-zinc-950 border border-zinc-800 p-1"
                                role="group"
                                aria-label="Instrument"
                              >
                                {Object.entries(INSTRUMENT_PRESETS).map(([key, preset]) => (
                                  <button
                                    key={key}
                                    type="button"
                                    title={preset.label}
                                    onClick={() => handleSetInstrument(key)}
                                    className={`flex flex-col items-center gap-0.5 py-2 rounded-lg text-[10px] font-semibold transition-colors leading-tight ${
                                      instrument === key
                                        ? 'bg-amber-500 text-zinc-950'
                                        : 'text-zinc-400 hover:text-zinc-200'
                                    }`}
                                  >
                                    <span className="text-base leading-none">{preset.emoji}</span>
                                    <span className="truncate w-full text-center px-0.5">{preset.label.split(' ')[0]}</span>
                                  </button>
                                ))}
                              </div>
                            </div>

                            {/* Strum / Arpeggio Toggle */}
                            <div className="space-y-1.5">
                              <label className="text-xs font-medium text-zinc-400 block">
                                Playback Style
                              </label>
                              <div
                                className="grid grid-cols-2 gap-1.5 rounded-xl bg-zinc-950 border border-zinc-800 p-1"

                                aria-label="Playback style"

                                <button

                                >
                                  Strum (35ms)

                                <button
                                  type="button"
                                  onClick={() => setPlayMode('arpeggio')}
                                  className={`py-2 px-3 rounded-lg text-xs font-semibold transition-colors ${
                                    playMode === 'arpeggio'
                                      ? 'bg-amber-500 text-zinc-950'

                                  }`}

                                  Arpeggio (140ms)

                              </div>
                            </div>

                            {/* Tempo Slider */}

                              <div className="flex items-center justify-between">
                                <label htmlFor="settings-bpm-slider" className="text-xs font-medium text-zinc-400">

                                  {bpm} BPM

                              <input

                              />
                              <div className="flex justify-between text-[10px] font-mono text-zinc-500">
                                <span>60 BPM</span>

                            </div>

                            {/* Test Audio Button */}
                            <div className="pt-1 border-t border-zinc-800 space-y-2">
                              <button
                                type="button"
                                onClick={() => {
                                  const testVoicing = getChordVoicing(selectedKey, '');
                                  playSingleChord(testVoicing.midiNotes);
                                }}
                                className="w-full h-9 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-xs font-semibold text-zinc-100 transition-colors active:scale-95"
                              >
                                Test Audio ({selectedKey} Chord)

                              <p className="text-[11px] text-zinc-500 leading-snug">

                            </div>

                            {/* About Menu Item */}

                              <button
                                type="button"
                                onClick={() => setSettingsView('about')}
                                className="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-zinc-950/70 hover:bg-zinc-800 border border-zinc-800 text-xs font-semibold text-zinc-200 transition-colors"
                              >
                                <span>About Modaly</span>
                                <span className="text-zinc-400 text-sm leading-none">›</span>
                              </button>
                            </div>
                          </>
                        ) : (
                          <>
                            <div className="flex items-center justify-between border-b border-zinc-800 pb-2.5">
                              <button
                                type="button"
                                onClick={() => setSettingsView('playback')}
                                className="inline-flex items-center gap-1 text-xs font-semibold text-amber-400 hover:text-amber-300 transition-colors"
                              >
                                <span>‹</span>
                                <span>Back</span>
                              </button>
                              <h2 className="text-sm font-semibold text-zinc-100">
                                About Modaly
                              </h2>
                              <button
                                type="button"
                                onClick={() => setSettingsOpen(false)}
                                aria-label="Close settings"
                                className="h-8 w-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center"
                              >
                                <CloseIcon className="w-4 h-4" />
                              </button>
                            </div>

                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 shrink-0 rounded-xl bg-amber-500 flex items-center justify-center text-zinc-950 font-black text-lg shadow-[0_0_14px_rgba(245,158,11,0.3)]">
                                M
                              </div>
                              <div>
                                <div className="text-sm font-bold text-zinc-100">Modaly</div>
                                <div className="text-[11px] text-zinc-400">
                                  Modal Harmony Companion
                                </div>
                              </div>
                            </div>

                            <p className="text-xs text-zinc-300 leading-relaxed">
                              An interactive guitar companion to explore modes, chord progressions, and soloing maps in any key
                            </p>

                            <div className="rounded-xl bg-zinc-950/80 border border-zinc-800 p-3 space-y-2 text-xs">
                              <div className="flex items-center justify-between gap-2">
                                <span className="text-zinc-500">Developer</span>
                                <span className="font-semibold text-zinc-100">Erik Todeschini</span>
                              </div>
                              <div className="flex items-center justify-between gap-2 border-t border-zinc-800/80 pt-2">
                                <span className="text-zinc-500">Company</span>
                                <span className="font-semibold text-amber-400">Split Rock Innovations</span>
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                    </>
                  )}
                </div>

                {/* Global Key Selector (All 12 Keys) */}
                <div
                  className="grid grid-cols-6 sm:grid-cols-12 gap-1.5"
                  role="group"
                  aria-label="Global Key Selector"
                >
                  {KEYS.map((keyName) => {
                    const active = selectedKey === keyName;
                    return (
                      <button
                        key={keyName}
                        type="button"
                        onClick={() => setSelectedKey(keyName)}
                        className={`h-9 rounded-xl text-xs sm:text-sm font-semibold transition-all border active:scale-95 ${
                          active
                            ? 'bg-amber-500 text-zinc-950 border-amber-400 shadow-[0_0_12px_rgba(245,158,11,0.3)]'
                            : 'bg-zinc-900 text-zinc-300 border-zinc-800 hover:border-zinc-700 hover:text-zinc-100'
                        }`}
                      >
                        {keyName}
                      </button>
                    );
                  })}
                </div>

                {/* Three Main Navigation Tabs */}
                <nav className="grid grid-cols-3 gap-2 pt-0.5" aria-label="Main sections">
                  <button
                    type="button"
                    onClick={() => handleSwitchTab('modal')}
                    className={`h-10 rounded-xl text-xs sm:text-sm font-semibold transition-all border ${
                      activeTab === 'modal'
                        ? 'bg-zinc-800 text-amber-400 border-amber-500/50'
                        : 'bg-zinc-900/50 text-zinc-400 border-zinc-800/80 hover:text-zinc-200'
                    }`}
                  >
                    Modal Library
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSwitchTab('dominant')}
                    className={`h-10 rounded-xl text-xs sm:text-sm font-semibold transition-all border ${
                      activeTab === 'dominant'
                        ? 'bg-zinc-800 text-amber-400 border-amber-500/50'
                        : 'bg-zinc-900/50 text-zinc-400 border-zinc-800/80 hover:text-zinc-200'
                    }`}
                  >
                    Styles &amp; Grooves
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSwitchTab('favorites')}
                    className={`h-10 rounded-xl text-xs sm:text-sm font-semibold transition-all border relative ${
                      activeTab === 'favorites'
                        ? 'bg-zinc-800 text-rose-400 border-rose-500/50'
                        : 'bg-zinc-900/50 text-zinc-400 border-zinc-800/80 hover:text-zinc-200'
                    }`}
                  >
                    <span className="inline-flex items-center gap-1.5 justify-center">
                      <HeartIcon className="w-3.5 h-3.5" filled={activeTab === 'favorites'} />
                      Favorites
                      {favorites.size > 0 && (
                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full leading-none ${
                          activeTab === 'favorites' ? 'bg-rose-500/25 text-rose-300' : 'bg-zinc-700 text-zinc-300'
                        }`}>{favorites.size}</span>
                      )}
                    </span>
                  </button>
                </nav>
              </div>
            </header>

            {/* Main Content Container */}
            <main className="max-w-2xl mx-auto px-3 sm:px-4 pt-4 space-y-4">
              {activeTab === 'favorites' ? (
                <>
                  {favorites.size === 0 ? (
                    <div className="flex flex-col items-center justify-center py-20 text-center space-y-3">
                      <HeartIcon className="w-10 h-10 text-zinc-700" />
                      <p className="text-sm font-semibold text-zinc-400">No favorites yet</p>
                      <p className="text-xs text-zinc-600 max-w-xs leading-relaxed">Tap the ♥ on any progression to save it here for quick access.</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {[...favorites].map((favId) => {
                        const entry = ALL_PROGRESSIONS_MAP[favId];
                        if (!entry) return null;
                        return (
                          <div key={favId}>
                            <p className="text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5 px-1">{entry.source}</p>
                            <ProgressionCard
                              progression={entry.progression}
                              progId={favId}
                              selectedKey={selectedKey}
                              isPlaying={playingProgId === favId}
                              activeChordIdx={activeChordIdx}
                              onTogglePlay={handleTogglePlay}
                              onPlaySingleChord={playSingleChord}
                              isFavorited={true}
                              onToggleFavorite={toggleFavorite}
                              defaultExpanded={true}
                            />
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>
              ) : activeTab === 'modal' ? (
                <>
                  {/* Swipeable / Scrollable Scale Group Choice Buttons */}
                  <HorizontalPillStrip
                    items={SCALE_GROUPS.map((g) => ({ id: g.id, label: g.name }))}
                    selectedId={selectedGroupId}
                    onSelect={handleSelectGroup}
                    ariaLabel="Scale Group Selector"
                  />

                  {/* Active Scale Group Heading */}
                  <div className="flex items-center justify-between px-1">
                    <h2 className="text-xs font-semibold uppercase tracking-wider text-zinc-400">
                      {currentGroup.name} Modes ({currentGroup.modes.length})
                    </h2>
                    <span className="text-[11px] text-zinc-500">
                      Tap a mode to explore progressions
                    </span>
                  </div>

                  {/* Numbered Modes Accordion List */}
                  <div className="space-y-2.5">
                    {currentGroup.modes.map((mode) => {

                      return (

                <>
                  {/* Style & Groove Category Filter Pills */}
                  <HorizontalPillStrip
                    items={DOMINANT_CATEGORIES.map((c) => ({ id: c, label: c }))}
                    selectedId={domCategory}
                    onSelect={(category) => {
                      stopPlayback();
                      setDomCategory(category);
                    }}
                    ariaLabel="Style and groove categories"
                  />

                  {/* Dominant 7th Progressions */}
                  <div className="space-y-3">
                    {filteredDominantProgs.map((prog, idx) => {
                      const progId = `dom-${prog.id}`;
                      return (
                        <ProgressionCard
                          key={`${domCategory}-${progId}`}
                          progression={prog}
                          progId={progId}
                          selectedKey={selectedKey}
                          isPlaying={playingProgId === progId}
                          activeChordIdx={activeChordIdx}
                          onTogglePlay={handleTogglePlay}
                          onPlaySingleChord={playSingleChord}
                          isFavorited={favorites.has(progId)}
                          onToggleFavorite={toggleFavorite}
                        />
                      );
                    })}
                  </div>
                </>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
